{% extends 'base.html' %}
{% load static %}
{% block title %}Cadastro de Funcionário | NEXUS Hub{% endblock %}
{% block page_title %}CADASTRO DE FUNCIONÁRIO{% endblock %}
{% block content %}
<style>
    /* Container Principal */
    .nexus-form-container {
        max-width: 900px;
        margin: 40px auto;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(0, 229, 255, 0.1);
        border-radius: 16px;
        padding: 40px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    /* Cabeçalho do Formulário */
    .nexus-form-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 35px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(0, 229, 255, 0.1);
    }

    .nexus-form-header i {
        color: #00e5ff;
        font-size: 1.8rem;
        filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.4));
    }

    .nexus-form-header h2 {
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
    }

    /* Labels Estilizados */
    .label-nexus {
        display: block;
        color: #00e5ff;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 1px;
        opacity: 0.9;
    }

    /* Wrapper para ícone + input */
    .input-wrapper-nexus {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
    }

    .input-wrapper-nexus i {
        position: absolute;
        left: 15px;
        color: #00e5ff;
        font-size: 1.1rem;
        z-index: 10;
        pointer-events: none;
    }

    /* Estilo Único para Inputs (Manuais e Django) */
    .form-control-nexus,
    .input-wrapper-nexus input,
    .input-wrapper-nexus textarea {
        width: 100% !important;
        background: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 8px !important;
        padding: 12px 15px 12px 45px !important;
        /* Espaço para o ícone */
        color: #ffffff !important;
        font-size: 0.95rem;
        outline: none !important;
        transition: all 0.3s ease;
    }

    /* Estilização para o campo gerado pelo Django {{ form.telefone }} */
    .input-wrapper-nexus input[name="telefone"],
    #id_telefone {
        display: block !important;
        width: 100% !important;
        height: 45px !important;
        /* Define uma altura mínima para a caixa aparecer */
        background: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(0, 229, 255, 0.2) !important;
        border-radius: 8px !important;
        padding: 0 15px 0 45px !important;
        /* 45px na esquerda para não cobrir o ícone */
        color: #ffffff !important;
        font-size: 0.95rem !important;
        outline: none !important;
    }

    /* Garante que o container flexível não "esmague" o campo */
    .form-group-nexus div {
        width: 100%;
    }

    /* Efeito de Foco */
    .form-control-nexus:focus,
    .input-wrapper-nexus input:focus,
    .input-wrapper-nexus textarea:focus {
        border-color: #00e5ff !important;
        background: rgba(0, 229, 255, 0.05) !important;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.2) !important;
    }

    /* Placeholder */
    ::placeholder {
        color: rgba(255, 255, 255, 0.2) !important;
    }

    /* Footer e Botões */
    .nexus-form-footer {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-nexus-cancel {
        color: #ff4d4d;
        text-decoration: none;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.85rem;
        padding: 12px 25px;
        border: 1px solid rgba(255, 77, 77, 0.3);
        border-radius: 8px;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-nexus-cancel:hover {
        background: rgba(255, 77, 77, 0.1);
        border-color: #ff4d4d;
    }

    .btn-nexus-save {
        background: #00e5ff;
        color: #000;
        border: none;
        padding: 12px 35px;
        border-radius: 8px;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.4s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-nexus-save:hover {
        background: #00f2ff;
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
        transform: translateY(-2px);
    }

    /* Layout de Colunas */
    .form-row-nexus {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    @media (max-width: 600px) {
        .form-row-nexus {
            grid-template-columns: 1fr;
        }
    }
</style>

<style>
    /* ... (Insira aqui o CSS que você enviou acima) ... */
</style>

<div class="fade-in-content container-fluid">
    <div class="nexus-form-container">
        <div class="nexus-form-header">
            <i class="bi bi-person-badge-fill"></i>
            <h2>NOVO REGISTRO DE FUNCIONÁRIO</h2>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-row-nexus" style="margin-bottom: 25px;">
                <div class="form-group-nexus">
                    <label class="label-nexus">NOME DO FUNCIONÁRIO</label>
                    <div class="input-wrapper-nexus">
                        <i class="bi bi-person-fill"></i>
                        <input type="text" name="nome" class="form-control-nexus" 
                               placeholder="Nome completo" required
                               value="{{ form.nome.value|default:'' }}">
                    </div>
                </div>

                <div class="form-group-nexus">
                    <label class="label-nexus">CARGO</label>
                    <div class="input-wrapper-nexus">
                        <i class="bi bi-briefcase-fill"></i>
                        <input type="text" name="cargo" class="form-control-nexus" 
                               placeholder="Ex: Vendedor" required
                               value="{{ form.cargo.value|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="form-row-nexus" style="margin-bottom: 25px;">
                <div class="form-group-nexus">
                    <label class="label-nexus">E-MAIL PROFISSIONAL</label>
                    <div class="input-wrapper-nexus">
                        <i class="bi bi-envelope-at-fill"></i>
                        <input type="email" name="email" class="form-control-nexus" 
                               placeholder="exemplo@email.com" required
                               value="{{ form.email.value|default:'' }}">
                    </div>
                </div>

                <div class="form-group-nexus">
                    <label class="label-nexus">TELEFONE / WHATSAPP</label>
                    <div class="input-wrapper-nexus">
                        <i class="bi bi-whatsapp"></i>
                        <input type="text" name="telefone" class="form-control-nexus" 
                               placeholder="(91) 98000-0000"
                               value="{{ form.telefone.value|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="form-group-nexus" style="margin-bottom: 25px;">
                <label class="label-nexus">ENDEREÇO / COMPLEMENTO</label>
                <div class="input-wrapper-nexus">
                    <i class="bi bi-geo-alt-fill"></i>
                    <input type="text" name="endereco" class="form-control-nexus" 
                           placeholder="Rua, Número, Bairro..."
                           value="{{ form.endereco.value|default:'' }}">
                </div>
            </div>

            <div class="nexus-form-footer">
                <a href="{% url 'lista_funcionarios' %}" class="btn-nexus-cancel">
                    <i class="bi bi-x-circle"></i> CANCELAR
                </a>
                <button type="submit" class="btn-nexus-save">
                    <i class="bi bi-check2-circle"></i> SALVAR FUNCIONÁRIO
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
