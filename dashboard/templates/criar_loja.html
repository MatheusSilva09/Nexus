<div class="card-nexus">
    <div class="card-header">
        <i class="fas fa-cog icon-cyan"></i> CRIAR NOVA LOJA
    </div>
    
    <form method="post" class="p-4">
        {% csrf_token %}
        
        <div class="form-group mb-4">
            <label class="label-nexus">NOME</label>
            {{ form.nome }}
        </div>

        <div class="form-group mb-4">
            <label class="label-nexus">DESCRIÇÃO</label>
            {{ form.descricao }}
        </div>

        <button type="submit" class="btn-nexus-outline w-100">
            <i class="fas fa-shield-alt"></i> SALVAR ALTERAÇÕES NO SISTEMA
        </button>
    </form>
</div>
