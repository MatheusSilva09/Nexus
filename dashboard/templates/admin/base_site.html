{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | NEXUS Hub Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: #00f2fe; font-family: 'Segoe UI', system-ui, sans-serif; font-weight: bold; letter-spacing: 1px;">
        NEXUS<span style="color: #ffffff; font-weight: 300;">Hub</span> <span style="font-size: 0.75rem; color: #94a3b8; vertical-align: middle; margin-left: 5px; border-left: 1px solid #1e293b; padding-left: 8px;">ADMINISTRAÇÃO</span>
    </a>
</h1>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* ==========================================================================
       TEMA NEXUS HUB - ADAPTADO EXCLUSIVAMENTE COM O PADRÃO DE TABELAS DA NEXUS
       ========================================================================== */
    
    :root {
        --nexus-blue: #2563eb !important;
        --azul-profundo: #020617 !important;
        --azul-card: #0f172a !important;
        --borda: #1e293b !important;
        --texto-muted: #94a3b8 !important;
        --turquesa-brilhante: #00f2fe !important;
        --turquesa-glow: rgba(0, 242, 254, 0.15) !important;
    }

    /* Fundo Principal e Container Geral */
    body, #container {
        background: radial-gradient(circle at 50% -20%, #1e293b 0%, var(--azul-profundo) 100%) !important;
        background-attachment: fixed !important;
        color: #f8fafc !important;
    }

    /* Cabeçalho Superior (Header) */
    #header {
        background: rgba(15, 23, 42, 0.8) !important;
        backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(37, 99, 235, 0.4) !important;
    }
    #header a:link, #header a:visited {
        color: #f8fafc !important;
    }
    #user-tools {
        color: var(--texto-muted) !important;
    }
    #user-tools a {
        color: var(--turquesa-brilhante) !important;
        font-weight: 700 !important;
    }

    /* Trilha de Navegação (Breadcrumbs) */
    .breadcrumbs {
        background: var(--azul-card) !important;
        border-bottom: 1px solid var(--borda) !important;
        color: var(--texto-muted) !important;
        padding: 12px 40px !important;
    }
    .breadcrumbs a {
        color: var(--turquesa-brilhante) !important;
    }

    /* Módulos do App (Títulos e Cards da Home do Admin) */
    .module h2, .module caption {
        background: rgba(0, 209, 255, 0.05) !important;
        color: var(--turquesa-brilhante) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        font-size: 0.8rem !important;
        text-transform: uppercase !important;
        letter-spacing: 1.5px !important;
        padding: 15px 20px !important;
        font-weight: bold !important;
    }
    .module {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        margin-bottom: 30px !important;
        box-shadow: none !important;
    }

    /* Ajuste fino para os links padrão de Adicionar/Modificar da Home */
    .module td a.addlink {
        background: transparent !important;
        color: #00e5ff !important;
        box-shadow: none !important;
        padding: 0 !important;
        border-radius: 0 !important;
        font-size: inherit !important;
        font-weight: 500 !important;
        text-transform: none !important;
    }
    .module td a.addlink:hover {
        background: transparent !important;
        color: #00b8cc !important;
        transform: none !important;
    }

    /* Isolando o painel lateral de ações recentes para não quebrar */
    #content-related .module {
        background: rgba(255, 255, 255, 0.02) !important;
    }
    #content-related ul li a {
        background: transparent !important;
        padding: 0 !important;
        color: var(--turquesa-brilhante) !important;
        font-size: inherit !important;
        font-weight: normal !important;
        text-transform: none !important;
        box-shadow: none !important;
        display: inline !important;
    }
    #content-related ul li {
        color: var(--texto-muted) !important;
        padding: 8px 0 !important;
    }

    /* ==========================================================================
       PADRONIZAÇÃO DA TABELA (Copiado do seu lista_clientes.html)
       ========================================================================== */
    div.results {
        background: transparent !important;
        border: none !important;
        border-radius: 0 !important;
        margin-bottom: 0 !important;
    }

    #result_list {
        width: 100% !important;
        border-collapse: collapse !important;
        background: transparent !important;
    }

    /* Cabeçalho da Tabela */
    #result_list th {
        padding: 15px 20px !important;
        color: #00d1ff !important;
        font-size: 0.8rem !important;
        text-transform: uppercase !important;
        background: rgba(0, 209, 255, 0.05) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-top: none !important;
        font-weight: 600 !important;
    }

    #result_list th a {
        color: #00d1ff !important;
    }

    /* Linhas e Células da Tabela */
    #result_list tbody tr {
        background: transparent !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
    }

    #result_list tbody tr.row1, #result_list tbody tr.row2 {
        background: transparent !important;
    }

    #result_list td, #result_list th.field-__str__, #result_list tbody th {
        padding: 14px 20px !important;
        color: #e0e0e0 !important;
        font-size: 0.9rem !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        background: transparent !important;
    }

    /* Efeito de Hover na Linha Inteira */
    #result_list tbody tr:hover td, 
    #result_list tbody tr:hover th {
        background: rgba(255, 255, 255, 0.02) !important;
        color: #ffffff !important;
    }

    /* Links de Ação dentro da Tabela */
    #result_list tbody a:link, #result_list tbody a:visited {
        color: var(--turquesa-brilhante) !important;
        font-weight: 500 !important;
    }

    /* Checkboxes da Tabela */
    .action-checkbox input[type=checkbox] {
        accent-color: var(--turquesa-brilhante) !important;
    }

    /* Barra de Ações (Ações em massa no topo da tabela) */
    .actions {
        background: rgba(255, 255, 255, 0.02) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 8px !important;
        padding: 10px 15px !important;
        color: var(--texto-muted) !important;
        margin-bottom: 15px !important;
    }
    .actions select {
        background: #0f172a !important;
        border: 1px solid var(--borda) !important;
        color: #fff !important;
        border-radius: 6px !important;
        padding: 4px 10px !important;
    }

    /* Paginador da Tabela */
    .paginator {
        background: transparent !important;
        border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
        color: var(--texto-muted) !important;
        padding: 15px 20px !important;
    }

    /* ==========================================================================
       FORMULÁRIOS E BOTÕES DE SALVAR (Apenas dentro das páginas de ação)
       ========================================================================== */
    .aligned label {
        color: #f8fafc !important;
    }
    input[type=text], input[type=password], input[type=number], select, textarea {
        background: rgba(15, 23, 42, 0.8) !important;
        border: 1px solid var(--borda) !important;
        color: #fff !important;
        border-radius: 6px !important;
        padding: 8px 12px !important;
    }
    input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, select:focus, textarea:focus {
        border-color: var(--turquesa-brilhante) !important;
        outline: none !important;
        box-shadow: 0 0 10px var(--turquesa-glow) !important;
    }

    /* Botões Grandes e Robustos de Salvar - Estilo .btn-nexus-add do seu lista_clientes.html */
    .submit-row input[type=submit], .submit-row .button {
        background-color: #00e5ff !important;
        border: none !important;
        color: #000000 !important;
        padding: 10px 24px !important;
        border-radius: 12px !important;
        font-size: 0.9rem !important;
        font-weight: 800 !important;
        text-transform: uppercase !important;
        transition: 0.3s ease-in-out !important;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.2) !important;
        cursor: pointer !important;
        display: inline-block !important;
    }
    .submit-row input[type=submit]:hover, .submit-row .button:hover {
        background-color: #00b8cc !important;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.4) !important;
        transform: translateY(-1px) !important;
    }

    /* Botão de Exclusão */
    .submit-row input.deletelink {
        background: rgba(255, 77, 77, 0.1) !important;
        border: 1px solid rgba(255, 77, 77, 0.3) !important;
        color: #ff4d4d !important;
        box-shadow: none !important;
        padding: 10px 24px !important;
        border-radius: 12px !important;
        text-transform: uppercase !important;
        font-weight: 800 !important;
    }
    .submit-row input.deletelink:hover {
        background: #ff4d4d !important;
        color: white !important;
        box-shadow: 0 0 15px rgba(255, 77, 77, 0.4) !important;
    }

    /* Links Gerais */
    a:link, a:visited {
        color: var(--turquesa-brilhante);
    }
</style>
{% endblock %}
