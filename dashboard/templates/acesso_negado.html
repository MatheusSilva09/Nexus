{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --nexus-blue: #2563eb;
            --azul-profundo: #020617;
            --azul-card: #0f172a;
            --borda: #1e293b;
            --texto-muted: #94a3b8;
            --turquesa-brilhante: #00f2fe;
        }

        html, body {
            height: 100%;
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, #020617 100%);
            background-attachment: fixed;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container-acesso-negado {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .icon-acesso-negado {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .title-acesso-negado {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(90deg, var(--turquesa-brilhante), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-acesso-negado {
            font-size: 1.1rem;
            color: var(--texto-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .box-info {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .info-text {
            color: #fca5a5;
            font-size: 0.95rem;
        }

        .btn-voltar {
            background: linear-gradient(90deg, var(--nexus-blue), #3b82f6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        .btn-voltar:hover {
            background: linear-gradient(90deg, #1d4ed8, #2563eb);
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.6);
            transform: translateY(-2px);
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container-acesso-negado">
        <div class="icon-acesso-negado">
            <i class="bi bi-shield-exclamation"></i>
        </div>
        
        <h1 class="title-acesso-negado">Acesso Negado</h1>
        
        <p class="message-acesso-negado">
            Esta funcionalidade é exclusiva do administrador do sistema.
        </p>

        <div class="box-info">
            <p class="info-text">
                <i class="bi bi-info-circle me-2"></i>
                Como vendedor, você tem acesso às abas: <strong>Estoque</strong> e <strong>Loja</strong>
            </p>
        </div>

        <a href="{% url 'lista_estoque' %}" class="btn-voltar">
            <i class="bi bi-arrow-left me-2"></i>
            Voltar para Estoque
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
