{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-cyan"><i class="fas fa-edit me-2"></i>EDITAR PRODUTO: {{ produto.nome }}</h2>
    </div>

    <div class="card card-nexus p-4">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="label-nexus">NOME DO PRODUTO</label>
                    <input type="text" name="nome" class="form-control input-nexus" value="{{ produto.nome }}" required>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="label-nexus">DESCRIÇÃO</label>
                    <textarea name="descricao" class="form-control input-nexus" rows="3">{{ produto.descricao }}</textarea>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="label-nexus">CATEGORIA</label>
                    <select name="categoria" class="form-control input-nexus">
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}" {% if cat.id == produto.categoria.id %}selected{% endif %}>
                                {{ cat.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="label-nexus">PREÇO SUGERIDO (R$)</label>
                    <input type="text" name="preco" class="form-control input-nexus" value="{{ produto.preco }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="label-nexus">QUANTIDADE ATUAL</label>
                    <input type="number" name="estoque" class="form-control input-nexus" value="{{ produto.estoque }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="label-nexus">ESTOQUE MÍNIMO (ALERTA)</label>
                    <input type="number" name="estoque_minimo" class="form-control input-nexus" value="{{ produto.estoque_minimo }}">
                </div>
            </div>

            <hr class="my-4 border-secondary">

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'lista_estoque' %}" class="btn btn-outline-secondary">
                    <i class="fas fa-times me-1"></i>CANCELAR
                </a>
                <button type="submit" class="btn btn-cyan">
                    <i class="fas fa-save me-1"></i>SALVAR ALTERAÇÕES
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
