{% extends 'base.html' %}
{% load static %}

{% block title %}{% if cliente %}Editar Informações do Cliente{% else %}Cadastro de Cliente{% endif %} | NEXUS Hub{% endblock %}

{% block content %}
<style>
    /* --- Content Container --- */
    .nexus-form-container {
        background: var(--bg-card);
        border: 1px solid var(--borda);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 900px;
        margin: 0 auto 30px auto;
        backdrop-filter: blur(15px);
    }

    /* --- Cabeçalho do Formulário --- */
    .nexus-form-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 35px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--borda);
    }

    .nexus-form-header i {
        font-size: 2.2rem;
        color: var(--turquesa-brilhante);
        filter: drop-shadow(0 0 8px var(--turquesa-glow));
    }

    .nexus-form-header h2 {
        color: var(--texto-principal);
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    /* --- Labels e Inputs Customizados --- */
    .label-nexus {
        color: var(--texto-muted);
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 0.8rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: block;
    }

    .input-wrapper-nexus {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
    }

    .input-wrapper-nexus i {
        position: absolute;
        left: 20px;
        color: var(--nexus-blue);
        font-size: 1.2rem;
        pointer-events: none;
    }

    .form-control-nexus,
    .input-wrapper-nexus input,
    .input-wrapper-nexus textarea {
        width: 100% !important;
        background: rgba(15, 23, 42, 0.5) !important;
        border: 1px solid var(--borda) !important;
        color: var(--texto-principal) !important;
        padding: 14px 20px 14px 55px !important;
        border-radius: 12px !important;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        outline: none;
    }

    .input-wrapper-nexus textarea {
        padding-left: 20px !important;
        min-height: 100px;
        resize: vertical;
    }

    .form-control-nexus:focus,
    .input-wrapper-nexus input:focus,
    .input-wrapper-nexus textarea:focus {
        border-color: var(--turquesa-brilhante) !important;
        box-shadow: 0 0 15px var(--turquesa-glow) !important;
        background: rgba(15, 23, 42, 0.8) !important;
    }

    ::placeholder {
        color: rgba(255, 255, 255, 0.25) !important;
    }

    /* --- Footer e Ações --- */
    .nexus-form-footer {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid var(--borda);
    }

    .btn-nexus-cancel {
        color: #ff4d4d;
        text-decoration: none;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        padding: 12px 25px;
        border: 1px solid rgba(255, 77, 77, 0.3);
        border-radius: 12px;
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-nexus-cancel:hover {
        background: rgba(255, 77, 77, 0.1);
        border-color: #ff4d4d;
    }

    .btn-nexus-save {
        background: linear-gradient(90deg, #2563eb, #00f2fe);
        color: #ffffff !important;
        border: none;
        padding: 14px 35px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 4px 15px var(--nexus-blue-glow);
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
    }

    .btn-nexus-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px var(--turquesa-glow);
        filter: brightness(1.1);
    }

    /* --- Modo Claro (Light Mode) Integrado --- */
    html.light-mode .nexus-form-container { background: #ffffff; }
    html.light-mode .nexus-form-header i { color: #2563eb; filter: none; }
    html.light-mode .nexus-form-header h2 { color: #0f172a; }
    html.light-mode .label-nexus { color: #475569 !important; }
    html.light-mode .input-wrapper-nexus i { color: #2563eb !important; }
    html.light-mode .form-control-nexus,
    html.light-mode .input-wrapper-nexus input,
    html.light-mode .input-wrapper-nexus textarea {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
    }
    html.light-mode ::placeholder { color: #94a3b8 !important; }
    html.light-mode .form-control-nexus:focus,
    html.light-mode .input-wrapper-nexus input:focus,
    html.light-mode .input-wrapper-nexus textarea:focus {
        border-color: #2563eb !important;
        box-shadow: 0 0 10px rgba(37, 99, 235, 0.15) !important;
    }
    html.light-mode .btn-nexus-save {
        background: linear-gradient(90deg, #2563eb, #1d4ed8);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2) !important;
    }
    html.light-mode .btn-nexus-cancel { border-color: #dc2626; color: #dc2626; }
    html.light-mode .btn-nexus-cancel:hover { background: #dc2626; color: #fff; }

    /* =======================================================
       ⚡ MEDIA QUERIES - RESPONSIVIDADE TOTAL (TELEMÓVEL) ⚡
       ======================================================= */
    @media (max-width: 767.98px) {
        .nexus-form-container {
            padding: 25px 20px;
            border-radius: 16px;
        }

        .nexus-form-header {
            flex-direction: column;
            text-align: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .nexus-form-footer {
            flex-direction: column-reverse;
            gap: 15px;
        }

        .btn-nexus-cancel, .btn-nexus-save {
            width: 100%;
            justify-content: center;
        }

        .input-wrapper-nexus input,
        .form-control-nexus {
            font-size: 0.9rem;
            padding: 12px 15px 12px 45px !important;
        }
    }
</style>

<div class="fade-in-content container-fluid">
    <div class="row justify-content-center">
        <div class="col-xl-9 col-lg-11 col-12">
            
            <div class="nexus-form-container">
                <div class="nexus-form-header">
                    <i class="bi {% if cliente %}bi-person-gear{% else %}bi-person-plus-fill{% endif %}"></i>
                    <h2>{% if cliente %}Editar Cliente{% else %}Novo Cliente{% endif %}</h2>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <!-- Nome Completo -->
                    <div class="mb-4">
                        <label class="label-nexus">Nome Completo</label>
                        <div class="input-wrapper-nexus">
                            <i class="bi bi-person-badge"></i>
                            <input type="text" name="nome" value="{{ form.nome.value|default:'' }}" class="form-control-nexus" placeholder="Digite o nome completo..." required>
                        </div>
                    </div>

                    <!-- Linha: Telefone e Email (Grid nativo que quebra em col-12 no mobile) -->
                    <div class="row">
                        <div class="col-md-6 col-12 mb-4">
                            <label class="label-nexus">Telefone / WhatsApp</label>
                            <div class="input-wrapper-nexus">
                                <i class="bi bi-whatsapp"></i>
                                <input type="text" id="id_telefone" name="telefone" value="{{ form.telefone.value|default:'' }}" class="form-control-nexus" placeholder="(91) 98000-0000" required>
                            </div>
                        </div>

                        <div class="col-md-6 col-12 mb-4">
                            <label class="label-nexus">E-mail (Opcional)</label>
                            <div class="input-wrapper-nexus">
                                <i class="bi bi-envelope-at"></i>
                                <input type="email" name="email" value="{{ form.email.value|default:'' }}" class="form-control-nexus" placeholder="exemplo@email.com">
                            </div>
                        </div>
                    </div>

                    <!-- Endereço -->
                    <div class="mb-4">
                        <label class="label-nexus">Endereço / Complemento</label>
                        <div class="input-wrapper-nexus">
                            <textarea name="endereco" rows="3" class="form-control-nexus" placeholder="Rua, número, bairro, referências providenciais...">{{ form.endereco.value|default:'' }}</textarea>
                        </div>
                    </div>

                    <!-- Rodapé de Ações -->
                    <div class="nexus-form-footer">
                        <a href="{% url 'lista_clientes' %}" class="btn-nexus-cancel">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn-nexus-save">
                            <i class="bi bi-check2-circle"></i> {% if cliente %}Salvar Alterações{% else %}Cadastrar Cliente{% endif %}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Biblioteca IMask via CDN estável -->
<script src="https://unpkg.com/imask"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Captura tanto pelo ID do Django quanto pelo name nativo
        var phoneElement = document.getElementById('id_telefone') || document.querySelector('input[name="telefone"]');

        if (phoneElement) {
            IMask(phoneElement, {
                mask: '(00) 00000-0000'
            });
            console.log("Mapeamento e máscara aplicados com sucesso.");
        }
    });
</script>
{% endblock %}
