{% extends "base.html" %}
{% load static %}

{% block title %}Criar Uma Nova Categoria | NEXUS Hub{% endblock %}
{% block page_title %}CRIAR UMA NOVA CATEGORIA{% endblock %}

{% block content %}
<div class="fade-in-content container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="nexus-form-card">
                <div class="card-header-nexus">
                    <h5 class="m-0 page-title-glow" style="font-size: 1.1rem;">
                        <i class="bi bi-plus-circle-fill me-2"></i>CATEGORIA
                    </h5>
                </div>

                <form method="POST" class="p-4 p-md-5">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="nexus-label">NOME DA CATEGORIA</label>
                        <div class="input-container-nexus">
                            <i class="bi bi-tag-fill"></i>
                            <input type="text" name="nome" class="form-control"
                                placeholder="Digite o nome da categoria..." required>
                        </div>
                    </div>

                    <div
                        class="d-flex justify-content-end align-items-center gap-4 mt-5 pt-4 border-top border-secondary">
                        <a href="{% url 'cadastrar_produto' %}" class="btn-nexus text-decoration-none">
                            <i class="bi bi-x-circle me-1"></i> CANCELAR
                        </a>
                        <button type="submit" class="btn-save-nexus">
                            <i class="bi bi-check2-circle me-1"></i> SALVAR
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Estilos aplicados consistentemente */
    .nexus-form-card {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(15px);
        border: 1px solid var(--borda);
        border-radius: 20px;
    }

    .card-header-nexus {
        padding: 25px 30px;
        background: rgba(30, 41, 59, 0.3);
        border-bottom: 1px solid var(--borda);
    }

    .nexus-label {
        display: block;
        color: var(--turquesa-brilhante);
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 12px;
    }

    .input-container-nexus {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-container-nexus i {
        position: absolute;
        left: 15px;
        color: var(--nexus-blue);
        font-size: 1.1rem;
    }

    .input-container-nexus input {
        width: 100%;
        background: rgba(15, 23, 42, 0.6) !important;
        border: 1px solid var(--borda) !important;
        border-radius: 10px;
        padding: 12px 15px 12px 45px;
        color: #e2e8f0 !important;
    }

    .input-container-nexus input::placeholder {
        color: #64748b !important;
    }

    .btn-nexus {
        background-color: transparent;
        color: #ff4444;
        border: 1px solid #ff4444;
        padding: 10px 30px;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.3s ease-in-out;
    }

    .btn-nexus:hover {
        background-color: #ff4444;
        color: #000000;
        box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
        transform: translateY(-2px);
    }

    .btn-save-nexus {
        background: transparent !important;
        border: 1px solid var(--turquesa-brilhante) !important;
        color: var(--turquesa-brilhante) !important;
        padding: 10px 30px;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.3s ease-in-out;
    }

    .btn-save-nexus:hover {
        background: var(--turquesa-brilhante) !important;
        color: #0f172a !important;
        box-shadow: 0 0 20px rgba(0, 255, 242, 0.4);
    }

    .btn-cancel {
        border: 1px solid #ff4444 !important;
        color: #ff4444 !important;
        padding: 10px 30px;
        border-radius: 8px;
        font-weight: 800;
        text-transform: uppercase;
    }
</style>
{% endblock %}
