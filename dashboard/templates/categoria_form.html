{% extends "base.html" %}
{% load static %}

{% block title %}Nova Categoria | NEXUS Hub{% endblock %}
{% block page_title %}CRIAR CATEGORIA{% endblock %}

{% block content %}
<div class="fade-in-content container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="nexus-form-card">
                <div class="card-header-nexus">
                    <h5 class="m-0 page-title-glow" style="font-size: 1.1rem;">
                        <i class="bi bi-plus-circle-fill me-2"></i>NOVA CATEGORIA
                    </h5>
                </div>

                <form method="POST" class="p-4 p-md-5">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="nexus-label">NOME DA CATEGORIA</label>
                        <div class="input-container-nexus">
                            <i class="bi bi-tag-fill"></i>
                            <input type="text" name="nome" class="form-control" 
                                   placeholder="Ex: Peças, Lubrificantes, Limpeza..." required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end align-items-center gap-4 mt-5 pt-4 border-top border-secondary">
                        <a href="{% url 'cadastrar_produto' %}" class="btn-cancel text-decoration-none">
                            <i class="bi bi-x-circle me-1"></i> CANCELAR
                        </a>
                        <button type="submit" class="logout-btn px-5">
                            <i class="bi bi-check2-circle me-2"></i> SALVAR CATEGORIA
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Estilos aplicados consistentemente */
    .nexus-form-card { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(15px); border: 1px solid var(--borda); border-radius: 20px; }
    .card-header-nexus { padding: 25px 30px; background: rgba(30, 41, 59, 0.3); border-bottom: 1px solid var(--borda); }
    .nexus-label { display: block; color: var(--turquesa-brilhante); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
    
    .input-container-nexus { position: relative; display: flex; align-items: center; }
    .input-container-nexus i { position: absolute; left: 15px; color: var(--nexus-blue); font-size: 1.1rem; }
    
    /* APLICADO: Cor do texto em cinza claro (#e2e8f0) para melhor legibilidade */
    .input-container-nexus input { 
        width: 100%; 
        background: rgba(15, 23, 42, 0.6) !important; 
        border: 1px solid var(--borda) !important; 
        border-radius: 10px; 
        padding: 12px 15px 12px 45px; 
        color: #e2e8f0 !important; 
    }

    /* Opcional: Estilo para o placeholder ficar visível */
    .input-container-nexus input::placeholder { color: #64748b !important; }

    .logout-btn { border: 1px solid var(--turquesa-brilhante) !important; color: var(--turquesa-brilhante) !important; padding: 10px 30px; border-radius: 8px; font-weight: 800; text-transform: uppercase; transition: 0.3s; }
    .btn-cancel { border: 1px solid #ff4444 !important; color: #ff4444 !important; padding: 10px 30px; border-radius: 8px; font-weight: 800; text-transform: uppercase; }
</style>
{% endblock %}
